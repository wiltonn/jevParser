[project]
name = "jev-diff"
version = "0.1.0"
description = "Year-over-year diff for GM vehicle order-guide exports, judged with TypeSafe Jev"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "rapidfuzz>=3.0",
    "pydantic>=2.6",
    # Web app and Jev judging: required by default because Vercel installs
    # only these, not extras.
    "typesafe-sdk",
    "fastapi>=0.121",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "pdfplumber>=0.11",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
# Kept empty so ``uv sync --extra web`` still works; now in ``dependencies``.
judge = []
web = []
pdf = ["pdfplumber>=0.11"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
jev-diff = "jev_diff.cli:main"
jev-web = "jev_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_diff", "src/jev_web"]

[tool.vercel]
entrypoint = "api.index:app"
